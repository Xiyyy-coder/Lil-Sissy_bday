<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday, Lil Sissy 💕</title>

    <link
        rel="stylesheet"
        href="lilsissy.css"
    >

</head>


<body>

    <!-- =====================================================
         MAIN BIRTHDAY PAGE
    ====================================================== -->

    <main class="sissy-page">


        <!-- =================================================
             BACKGROUND DECORATIONS
        ================================================== -->

        <div
            class="sissy-decorations"
            aria-hidden="true"
        >

            <!-- Flowers -->

            <span class="sissy-flower sissy-flower-1">
                🌸
            </span>

            <span class="sissy-flower sissy-flower-2">
                🌷
            </span>

            <span class="sissy-flower sissy-flower-3">
                🌸
            </span>

            <span class="sissy-flower sissy-flower-4">
                🌷
            </span>

            <span class="sissy-flower sissy-flower-5">
                🌸
            </span>

            <span class="sissy-flower sissy-flower-6">
                🌼
            </span>


            <!-- Stars -->

            <span class="sissy-star sissy-star-1">
                ✦
            </span>

            <span class="sissy-star sissy-star-2">
                ✧
            </span>

            <span class="sissy-star sissy-star-3">
                ✦
            </span>

            <span class="sissy-star sissy-star-4">
                ✨
            </span>

            <span class="sissy-star sissy-star-5">
                ✦
            </span>

            <span class="sissy-star sissy-star-6">
                ✧
            </span>


            <!-- Hearts -->

            <span class="sissy-heart sissy-heart-1">
                ♡
            </span>

            <span class="sissy-heart sissy-heart-2">
                ♡
            </span>

            <span class="sissy-heart sissy-heart-3">
                ♡
            </span>

            <span class="sissy-heart sissy-heart-4">
                ♡
            </span>

        </div>


        <!-- =================================================
             TOP SMALL TEXT
        ================================================== -->

        <div class="sissy-top-text">

            <span class="sissy-mini-star">
                ✦
            </span>

            A Special Celebration

            <span class="sissy-mini-star">
                ✦
            </span>

        </div>


        <!-- =================================================
             BIRTHDAY TITLE
        ================================================== -->

        <section class="sissy-title-section">

            <h1 class="sissy-title">

                <span>
                    Happy
                </span>

                <span>
                    Birthday,
                </span>

            </h1>


            <h2 class="sissy-name">

                Eljane Rose Coniendo

            </h2>



            <div class="sissy-main-heart">

                <span>
                    ♡
                </span>

            </div>

        </section>


        <!-- =================================================
             SUBTITLE
        ================================================== -->

        <p class="sissy-subtitle">

            Today is all about celebrating you.

        </p>


        <!-- =================================================
             CAKE
        ================================================== -->

        <section
            class="sissy-cake-area"
            aria-label="Birthday cake"
        >

            <!-- Cake sparkles -->

            <div class="sissy-cake-sparkle sparkle-one">
                ✦
            </div>

            <div class="sissy-cake-sparkle sparkle-two">
                ✧
            </div>

            <div class="sissy-cake-sparkle sparkle-three">
                ✦
            </div>

            <div class="sissy-cake-sparkle sparkle-four">
                ✨
            </div>


            <div class="sissy-cake">


                <!-- ==============================
                     TOP TIER
                =============================== -->

                <div class="sissy-cake-top">


                    <!-- Candles -->

                    <div class="sissy-candles">

                        <div class="sissy-candle">
                            <span class="sissy-flame"></span>
                        </div>

                        <div class="sissy-candle">
                            <span class="sissy-flame"></span>
                        </div>

                        <div class="sissy-candle">
                            <span class="sissy-flame"></span>
                        </div>

                        <div class="sissy-candle">
                            <span class="sissy-flame"></span>
                        </div>

                        <div class="sissy-candle">
                            <span class="sissy-flame"></span>
                        </div>

                    </div>


                    <div class="sissy-tier-decoration">

                        <span>♡</span>
                        <span>✦</span>
                        <span>♡</span>

                    </div>

                </div>


                <!-- ==============================
                     MIDDLE TIER
                =============================== -->

                <div class="sissy-cake-middle">

                    <div class="sissy-middle-decoration">

                        <span>•</span>
                        <span>♡</span>
                        <span>•</span>

                    </div>

                </div>


                <!-- ==============================
                     BOTTOM TIER
                =============================== -->

                <div class="sissy-cake-bottom">

                    <div class="sissy-bottom-decoration">

                        <span>♡</span>
                        <span>✦</span>
                        <span>♡</span>

                    </div>

                </div>


                <!-- Cake plate -->

                <div class="sissy-cake-plate"></div>

            </div>

        </section>


        <!-- =================================================
             SURPRISE BUTTON
        ================================================== -->

        <button
            type="button"
            class="sissy-surprise-button"
            id="sissySurpriseButton"
        >

            <span>
                Open Your Birthday Surprise
            </span>

            <span class="sissy-button-sparkle">
                ✨
            </span>

        </button>


        <!-- =================================================
             DATE
        ================================================== -->

        <div class="sissy-date">

            <span>
                OCTOBER 5
            </span>

            <span class="sissy-date-star">
                ◆
            </span>

        </div>


        <!-- =================================================
             CLICK MESSAGE
        ================================================== -->

        <div
            class="sissy-click-message"
            id="sissyClickMessage"
        >

            ✨ Get ready for your surprise! ✨

        </div>


    </main>


    <script src="lilsissy.js"></script>

</body>

</html>
